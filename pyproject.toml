[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debacal"
version = "0.1.4"
description = "A local-first, keyboard-friendly desktop calendar"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    # PYSIDE-3474/3486: 6.12.0 over-releases None/True on Python <= 3.11.
    "PySide6>=6.7,<7,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.7,<7; python_version >= '3.12'",
    "icalendar>=6.3,<8",
    "caldav>=2,<4",
    "vdirsyncer>=0.21,<0.22",
    "python-dateutil>=2.9,<3",
    "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/thobl/debacal"
Issues = "https://github.com/thobl/debacal/issues"
Releases = "https://github.com/thobl/debacal/releases"

[project.optional-dependencies]
dev = ["pytest>=9", "build>=1.2,<2", "setuptools>=77"]

[project.scripts]
debacal = "debacal.__main__:main"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["debacal*"]

[tool.setuptools.data-files]
"share/applications" = ["packaging/linux/debacal.desktop"]
"share/icons/hicolor/scalable/apps" = ["packaging/linux/debacal.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
