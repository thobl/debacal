[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debacal"
version = "0.1.0"
description = "A local-first, keyboard-friendly desktop calendar"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "icalendar>=6,<8", "caldav>=2,<4", "vdirsyncer>=0.21,<0.22", "python-dateutil>=2.9,<3", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
debacal = "debacal.__main__:main"

[tool.setuptools.packages.find]
include = ["debacal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
