name: Checks and release
run-name: ${{ github.ref_name }} · ${{ github.event_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install desktop libraries and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 desktop-file-utils
      - name: Install app and tests
        run: python -m pip install -e '.[dev]'
      - run: desktop-file-validate packaging/linux/debacal.desktop
      - run: python -m pytest -q --tb=short --maxfail=5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install reproducible release toolchain
        run: python -m pip install build==1.6.1 setuptools==84.2.1 wheel
      - name: Build and verify release assets
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish release
        run: bash scripts/publish_release.sh
  receipt:
    if: always() && github.event_name != 'pull_request'
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_RESULT: ${{ needs.release.result }}
      CHECK_RESULT: ${{ needs.test.result }}
      RECEIPT_REF: ${{ startsWith(github.ref, 'refs/tags/') && 'debacal-releases' || 'debacal-checks' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record publication receipt for SSH-only maintainers
        shell: bash
        run: |
          set -euo pipefail
          printf '{}' > /tmp/debacal-release-receipt.json
          if [ "$RECEIPT_REF" = debacal-releases ]; then
            if ! gh release view "$RELEASE_TAG" --json url,tagName,publishedAt,isDraft,assets > /tmp/debacal-release-receipt.json; then
              printf '{}' > /tmp/debacal-release-receipt.json
            fi
          fi
          python3 scripts/collect_ci_receipt.py /tmp/debacal-release-receipt.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin "refs/notes/$RECEIPT_REF" >/dev/null 2>&1; then
            git fetch origin "refs/notes/$RECEIPT_REF:refs/notes/$RECEIPT_REF"
          fi
          git notes --ref="$RECEIPT_REF" add -f -F /tmp/debacal-release-receipt.json HEAD
          git push origin "refs/notes/$RECEIPT_REF"
